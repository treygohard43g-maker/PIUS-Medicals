<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | Pius Medical Accessories</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           PAYMENT PAGE
           ===================================================== */

        .payment-page {
            min-height: 100vh;
            background:
                linear-gradient(
                    180deg,
                    #f4f8fc 0%,
                    #ffffff 50%,
                    #eef4f8 100%
                );
            color: #172033;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .payment-header {
            width: 100%;
            min-height: 78px;
            background: #0b2a4a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow:
                0 8px 25px rgba(11,42,74,0.16);
        }

        .payment-header-inner {
            width: min(900px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .payment-back-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 12px;
            background: rgba(255,255,255,0.10);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s ease;
        }

        .payment-back-btn:hover {
            background: rgba(255,255,255,0.17);
        }

        .payment-brand {
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .payment-main {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 45px 0 70px;
        }

        .payment-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .payment-heading-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #eef7ff;
            border: 1px solid #dceefe;
            color: #1677c8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
