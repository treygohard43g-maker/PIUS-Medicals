<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | Pius Medical Accessories</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="payment-page">

    <!-- HEADER -->

    <header class="site-header">

        <div class="header-container">

            <a href="dashboard.html" class="brand">
                <span class="brand-name">
                    Pius <strong>Medical Accessories</strong>
                </span>
            </a>

        </div>

    </header>


    <!-- PAYMENT PAGE -->

    <main class="payment-main">

        <section class="payment-container">

            <div class="payment-header">

                <div class="payment-icon">
                    <i class="fa-solid fa-credit-card"></i>
                </div>

                <h1>
                    Complete Your Payment
                </h1>

                <p>
                    Review your order and select a payment method.
                </p>

            </div>


            <!-- ORDER INFORMATION -->

            <div class="payment-card">

                <h2>
                    Order Information
                </h2>

                <div class="order-info">

                    <div>
                        <span>Order ID</span>
                        <strong id="orderId">
                            Loading...
                        </strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong id="orderStatus">
                            Pending
                        </strong>
                    </div>

                </div>

            </div>


            <!-- PAYMENT METHOD -->

            <div class="payment-card">

                <h2>
                    Payment Method
                </h2>

                <div class="payment-methods">

                    <label class="payment-method">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="card"
                            checked
                        >

                        <span>
                            <i class="fa-solid fa-credit-card"></i>
                        </span>

                        <div>
                            <strong>
                                Debit / Credit Card
                            </strong>

                            <small>
                                Pay with your bank card
                            </small>
                        </div>

                    </label>


                    <label class="payment-method">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="bank"
                        >

                        <span>
                            <i class="fa-solid fa-building-columns"></i>
                        </span>

                        <div>
                            <strong>
                                Bank Transfer
                            </strong>

                            <small>
                                Pay through bank transfer
                            </small>
                        </div>

                    </label>


                    <label class="payment-method">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="cashapp_paypal"
                        >

                        <span>
                            <i class="fa-solid fa-wallet"></i>
                        </span>

                        <div>
                            <strong>
                                Other Payment
                            </strong>

                            <small>
                                Other available payment options
                            </small>
                        </div>

                    </label>

                </div>

            </div>


            <!-- ORDER TOTAL -->

            <div class="payment-card">

                <h2>
                    Order Total
                </h2>

                <div class="total-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="paymentSubtotal">
                        $0.00
                    </strong>

                </div>


                <div class="total-row">

                    <span>
                        Delivery
                    </span>

                    <strong id="paymentDelivery">
                        $0.00
                    </strong>

                </div>


                <div class="total-divider"></div>


                <div class="total-row total">

                    <span>
                        Total
                    </span>

                    <strong id="paymentTotal">
                        $0.00
                    </strong>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="paymentMessage"
                class="payment-message"
            ></div>


            <!-- PAYMENT BUTTON -->

            <button
                type="button"
                id="confirmPaymentBtn"
                class="confirm-payment-btn"
            >

                <i class="fa-solid fa-lock"></i>

                <span>
                    Continue to Payment
                </span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <p class="payment-security">

                <i class="fa-solid fa-shield-halved"></i>

                Secure checkout

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="payment.js"
    ></script>

</body>

</html>
