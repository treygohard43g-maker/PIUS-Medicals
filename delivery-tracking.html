<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Delivery - Pius Medical Accessories</title>

    <meta
        name="description"
        content="Track your Pius Medical Accessories delivery in real time."
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .tracking-page {
            min-height: 100vh;
            background: #f5f7fa;
            color: #071d3b;
        }


        /* =========================================
           HEADER
        ========================================= */

        .tracking-header {
            background: #071d3b;
            color: white;

            padding: 18px 20px;

            display: flex;
            align-items: center;

            gap: 15px;

            position: sticky;
            top: 0;

            z-index: 1000;

            box-shadow:
                0 3px 15px rgba(0,0,0,.14);
        }


        .back-btn {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 12px;

            background:
                rgba(255,255,255,.10);

            color: white;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .back-btn:active {
            transform: scale(.96);
        }


        .tracking-header h1 {
            font-size: 21px;
            margin: 0;
        }


        .tracking-header p {
            font-size: 12px;

            opacity: .7;

            margin-top: 3px;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .tracking-container {
            width: min(950px, 94%);

            margin: 25px auto 50px;
        }


        /* =========================================
           LIVE INDICATOR
        ========================================= */

        .live-bar {
            background: white;

            border-radius: 16px;

            padding: 13px 16px;

            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 5px 20px rgba(0,0,0,.05);
        }


        .live-status {
            display: flex;
            align-items: center;

            gap: 9px;

            font-size: 13px;

            font-weight: 700;
        }


        .live-dot {
            width: 9px;
            height: 9px;

            background: #16a05d;

            border-radius: 50%;

            box-shadow:
                0 0 0 5px rgba(22,160,93,.12);

            animation: livePulse 1.8s infinite;
        }


        @keyframes livePulse {

            0% {
                box-shadow:
                    0 0 0 0 rgba(22,160,93,.35);
            }

            70% {
                box-shadow:
                    0 0 0 7px rgba(22,160,93,0);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(22,160,93,0);
            }

        }


        .last-updated {
            color: #7a8494;

            font-size: 11px;

            text-align: right;
        }


        /* =========================================
           ORDER SUMMARY CARD
        ========================================= */

        .order-summary {
            background: white;

            border-radius: 20px;

            padding: 22px;

            margin-bottom: 18px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .summary-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }


        .summary-label {
            color: #7a8494;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .order-number {
            font-size: 18px;

            font-weight: 800;

            word-break: break-all;
        }


        .status-badge {
            padding: 8px 13px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 800;

            white-space: nowrap;
        }


        .status-pending {
            background: #fff4d6;
            color: #9a6800;
        }


        .status-processing {
            background: #e5f0ff;
            color: #1764b0;
        }


        .status-shipped,
        .status-in-transit {
            background: #e8e5ff;
            color: #5545b8;
        }


        .status-out-for-delivery {
            background: #fff0df;
            color: #b86600;
        }


        .status-delivered {
            background: #e4f8ec;
            color: #18864b;
        }


        .status-cancelled {
            background: #ffe6e6;
            color: #c62828;
        }


        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }


        .summary-item {
            background: #f7f9fb;

            border-radius: 13px;

            padding: 14px;
        }


        .summary-item i {
            color: #071d3b;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .summary-item span {
            display: block;

            color: #7a8494;

            font-size: 11px;

            margin-bottom: 4px;
        }


        .summary-item strong {
            display: block;

            font-size: 13px;

            word-break: break-word;
        }


        /* =========================================
           TRACKING MESSAGE
        ========================================= */

        .tracking-message {
            background:
                linear-gradient(
                    135deg,
                    #071d3b,
                    #0b2c59
                );

            color: white;

            border-radius: 20px;

            padding: 22px;

            margin-bottom: 18px;

            box-shadow:
                0 8px 25px rgba(7,29,59,.16);
        }


        .message-header {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 10px;
        }


        .message-icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.12);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }


        .message-header h3 {
            font-size: 16px;
            margin: 0;
        }


        .tracking-message p {
            font-size: 13px;

            line-height: 1.6;

            opacity: .82;

            margin: 0;
        }


        /* =========================================
           MAP
        ========================================= */

        .map-card {
            background: white;

            border-radius: 20px;

            padding: 18px;

            margin-bottom: 18px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .section-title {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;
        }


        .section-title i {
            width: 34px;
            height: 34px;

            border-radius: 10px;

            background: #eef3f8;

            color: #071d3b;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .section-title h2 {
            font-size: 17px;
            margin: 0;
        }


        .map-wrapper {
            position: relative;

            overflow: hidden;

            border-radius: 15px;

            background: #eef1f4;

            min-height: 310px;
        }


        #trackingMap {
            width: 100%;
            height: 310px;

            display: none;
        }


        .map-placeholder {
            min-height: 310px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            color: #697386;
        }


        .map-placeholder i {
            font-size: 38px;

            color: #071d3b;

            margin-bottom: 14px;
        }


        .map-placeholder h3 {
            color: #071d3b;

            font-size: 15px;

            margin-bottom: 7px;
        }


        .map-placeholder p {
            font-size: 12px;

            max-width: 400px;

            line-height: 1.6;

            margin: 0;
        }


        .location-info {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 14px;

            padding: 13px;

            background: #f7f9fb;

            border-radius: 12px;
        }


        .location-info i {
            color: #c62828;

            font-size: 17px;
        }


        .location-info div {
            min-width: 0;
        }


        .location-info span {
            display: block;

            color: #7a8494;

            font-size: 11px;

            margin-bottom: 3px;
        }


        .location-info strong {
            display: block;

            font-size: 13px;

            word-break: break-word;
        }


        /* =========================================
           PROGRESS
        ========================================= */

        .progress-card {
            background: white;

            border-radius: 20px;

            padding: 22px;

            margin-bottom: 18px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .timeline {
            position: relative;

            margin-top: 22px;
        }


        .timeline::before {
            content: "";

            position: absolute;

            left: 17px;

            top: 17px;

            bottom: 17px;

            width: 2px;

            background: #e3e7ec;
        }


        .timeline-step {
            position: relative;

            display: flex;

            gap: 15px;

            padding-bottom: 24px;
        }


        .timeline-step:last-child {
            padding-bottom: 0;
        }


        .timeline-icon {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            background: #f0f2f5;

            color: #9aa3af;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 2;

            flex-shrink: 0;

            border: 3px solid white;

            font-size: 13px;
        }


        .timeline-step.completed .timeline-icon {
            background: #071d3b;

            color: white;
        }


        .timeline-step.current .timeline-icon {
            background: #18864b;

            color: white;

            box-shadow:
                0 0 0 5px rgba(24,134,75,.12);
        }


        .timeline-content {
            padding-top: 2px;

            flex: 1;
        }


        .timeline-content h3 {
            font-size: 14px;

            margin: 0 0 4px;
        }


        .timeline-content p {
            color: #7a8494;

            font-size: 11px;

            line-height: 1.5;

            margin: 0;
        }


        .timeline-step.completed
        .timeline-content h3 {
            color: #071d3b;
        }


        .timeline-step:not(.completed)
        .timeline-content h3 {
            color: #9aa3af;
        }


        /* =========================================
           ESTIMATED DELIVERY
        ========================================= */

        .delivery-card {
            background: white;

            border-radius: 20px;

            padding: 22px;

            margin-bottom: 18px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .delivery-box {
            background: #f7f9fb;

            border-radius: 15px;

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .delivery-icon {
            width: 48px;
            height: 48px;

            border-radius: 14px;

            background: #071d3b;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;

            flex-shrink: 0;
        }


        .delivery-box span {
            display: block;

            color: #7a8494;

            font-size: 11px;

            margin-bottom: 4px;
        }


        .delivery-box strong {
            display: block;

            font-size: 15px;
        }


        /* =========================================
           NO TRACKING DATA
        ========================================= */

        .awaiting-card {
            background: white;

            border-radius: 20px;

            padding: 35px 22px;

            text-align: center;

            border: 1px solid #edf0f4;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);

            margin-bottom: 18px;
        }


        .awaiting-card i {
            font-size: 40px;

            color: #071d3b;

            margin-bottom: 15px;
        }


        .awaiting-card h3 {
            font-size: 17px;

            margin-bottom: 8px;
        }


        .awaiting-card p {
            color: #697386;

            font-size: 13px;

            line-height: 1.6;

            max-width: 500px;

            margin: 0 auto;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error-box {
            background: white;

            border-radius: 20px;

            padding: 45px 20px;

            text-align: center;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .error-box i {
            font-size: 40px;

            color: #c62828;

            margin-bottom: 15px;
        }


        .error-box h3 {
            margin-bottom: 8px;
        }


        .error-box p {
            color: #697386;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 20px;
        }


        .back-orders-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: #071d3b;

            color: white;

            text-decoration: none;

            padding: 12px 18px;

            border-radius: 10px;

            font-weight: 700;

            font-size: 13px;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {
            background: white;

            border-radius: 20px;

            padding: 60px 20px;

            text-align: center;

            color: #697386;

            box-shadow:
                0 6px 22px rgba(0,0,0,.06);
        }


        .loading i {
            font-size: 28px;

            margin-bottom: 12px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .tracking-container {
                width: 92%;

                margin-top: 18px;
            }


            .tracking-header {
                padding: 15px;
            }


            .tracking-header h1 {
                font-size: 18px;
            }


            .order-summary,
            .progress-card,
            .map-card,
            .delivery-card,
            .tracking-message {
                padding: 17px;
            }


            .summary-top {
                flex-direction: column;
            }


            .summary-grid {
                grid-template-columns: 1fr;
            }


            .live-bar {
                align-items: flex-start;

                flex-direction: column;
            }


            .last-updated {
                text-align: left;
            }


            .map-wrapper,
            #trackingMap,
            .map-placeholder {
                min-height: 260px;

                height: 260px;
            }


            #trackingMap {
                height: 260px;
            }


            .delivery-box {
                align-items: flex-start;
            }

        }


    </style>

</head>


<body class="tracking-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="tracking-header">

        <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Back to orders"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div>

            <h1>
                Track Delivery
            </h1>

            <p>
                Follow your order status in real time
            </p>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="tracking-container">

        <div id="trackingContent">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <div>
                    Loading delivery information...
                </div>

            </div>

        </div>

    </main>

<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="delivery-tracking.js"></script>

</body>
</html>
