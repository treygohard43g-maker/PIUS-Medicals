<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pius Medicals</title>
    
    <link rel="stylesheet" href="css/style.css">

    <meta
        name="description"
        content="Pius Medicals - Quality medical accessories and healthcare essentials."
    >
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="header-container">

            <!-- LOGO -->

            <a href="index.html" class="brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <div class="brand-name">
                    <strong>Pius</strong>
                    <span>Medicals</span>
                </div>

            </a>


            <!-- DESKTOP NAVIGATION -->

            <nav class="main-nav">

                <a href="index.html" class="active">
                    Home
                </a>

                <a href="#">
                    Shop
                </a>

                <a href="#">
                    Categories
                </a>

                <a href="#">
                    About Us
                </a>

                <a href="#">
                    Contact
                </a>

            </nav>


            <!-- HEADER ACTIONS -->

            <div class="header-actions">

                <button
                    type="button"
                    class="header-button"
                    aria-label="Search"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>


                <button
                    type="button"
                    class="header-button cart-button"
                    aria-label="Shopping cart"
                >
                    <i class="fa-solid fa-cart-shopping"></i>

                    <span class="cart-badge">
                        0
                    </span>

                </button>


                <button
                    type="button"
                    class="menu-button"
                    aria-label="Open menu"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

            </div>

        </div>

    </header>


    <!-- ================= END HEADER ================= -->


</body>

</html>
