<!DOCTYPE 
html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - Pius Medical Accessories</title>

    <meta
        name="description"
        content="View your Pius Medical Accessories orders."
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           ORDERS PAGE
        ========================================= */

        .orders-page {
            min-height: 100vh;
            background: #f5f7fa;
        }


        /* HEADER */

        .orders-header {
            background: #071d3b;
            color: white;
            padding: 18px 20px;

            display: flex;
            align-items: center;
            gap: 15px;

            position: sticky;
            top: 0;
            z-index: 100;

            box-shadow:
                0 3px 15px rgba(0,0,0,.12);
        }


        .back-btn {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 12px;

            background:
                rgba(255,255,255,.1);

            color: white;

            font-size: 22px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .back-btn:active {
            transform: scale(.96);
        }


        .orders-header h1 {
            font-size: 21px;
        }


        .orders-header p {
            font-size: 12px;
            opacity: .7;
            margin-top: 3px;
        }


        /* CONTENT */

        .orders-container {
            width: min(900px, 94%);
            margin: 25px auto 40px;
        }


        .welcome-box {
            background: white;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }


        .welcome-box h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }


        .welcome-box p {
            color: #697386;
            font-size: 14px;
        }


        /* ORDER CARD */

        .order-card {
            background: white;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);

            border: 1px solid #edf0f4;
        }


        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 15px;

            margin-bottom: 16px;
        }


        .order-number {
            font-size: 15px;
            font-weight: 700;
        }


        .order-date {
            color: #7a8494;
            font-size: 12px;
            margin-top: 5px;
        }


        /* STATUS */

        .status {
            padding: 7px 11px;

            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }


        .status.pending {
            background: #fff4d6;
            color: #9a6800;
        }


        .status.processing {
            background: #e5f0ff;
            color: #1764b0;
        }


        .status.shipped {
            background: #e8e5ff;
            color: #5545b8;
        }


        .status.delivered {
            background: #e4f8ec;
            color: #18864b;
        }


        .status.cancelled {
            background: #ffe6e6;
            color: #c62828;
        }


        /* ITEMS */

        .order-item {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 12px 0;

            border-top:
                1px solid #eef1f4;
        }


        .product-image {
            width: 62px;
            height: 62px;

            border-radius: 12px;

            object-fit: cover;

            background: #f1f3f6;

            flex-shrink: 0;
        }


        .item-info {
            flex: 1;
            min-width: 0;
        }


        .item-name {
            font-size: 14px;
            font-weight: 700;

            margin-bottom: 5px;
        }


        .item-quantity {
            color: #7a8494;
            font-size: 12px;
        }


        .item-price {
            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* BOTTOM */

        .order-bottom {
            border-top:
                1px solid #eef1f4;

            margin-top: 8px;

            padding-top: 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .total-label {
            color: #7a8494;
            font-size: 13px;
        }


        .total-price {
            font-size: 19px;
            font-weight: 700;

            color: #071d3b;
        }


        .view-btn {
            border: 0;

            background: #071d3b;
            color: white;

            padding: 11px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;
        }


        .view-btn:active {
            transform: scale(.97);
        }


        /* EMPTY */

        .empty-orders {
            background: white;

            border-radius: 18px;

            padding: 55px 20px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }


        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }


        .empty-orders h3 {
            margin-bottom: 8px;
        }


        .empty-orders p {
            color: #7a8494;

            font-size: 14px;

            margin-bottom: 20px;
        }


        .shop-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            background: #071d3b;
            color: white;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 10px;

            font-weight: 700;
        }


        /* LOADING */

        .loading {
            text-align: center;

            padding: 50px;

            color: #697386;
        }


        .loading i {
            font-size: 25px;
            margin-bottom: 12px;
        }


        /* ERROR */

        .error-box {
            background: white;

            border-radius: 18px;

            padding: 40px 20px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }


        .error-box i {
            font-size: 38px;
            margin-bottom: 15px;
            color: #c62828;
        }


        .error-box p {
            color: #697386;
            font-size: 14px;
            margin-top: 8px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .orders-container {
                width: 92%;
                margin-top: 18px;
            }


            .order-card {
                padding: 16px;
            }


            .order-top {
                gap: 10px;
            }


            .product-image {
                width: 55px;
                height: 55px;
            }


            .item-name {
                font-size: 13px;
            }


            .item-price {
                font-size: 13px;
            }


            .order-bottom {
                align-items: flex-start;
            }


            .view-btn {
                padding: 10px 13px;
            }

        }

    </style>

</head>


<body class="orders-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="orders-header">

        <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Go back"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div>

            <h1>
                My Orders
            </h1>

            <p>
                View and track your purchases
            </p>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="orders-container">


        <section class="welcome-box">

            <h2>
                Your Orders
            </h2>

            <p>
                View your purchases and check the
                current status of each order.
            </p>

        </section>



        <div id="ordersList">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <div>
                    Loading your orders...
                </div>

            </div>

        </div>


    </main>

 <script type="module" src="orders.js"></script>

</body>

</html>
