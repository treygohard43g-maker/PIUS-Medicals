<!DOCTYPE 
html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - Pius Medical Accessories</title>

    <meta
        name="description"
        content="View your Pius Medical Accessories orders."
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="orders-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="orders-header">

        <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Go back"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div>

            <h1>
                My Orders
            </h1>

            <p>
                View and track your purchases
            </p>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="orders-container">


        <section class="welcome-box">

            <h2>
                Your Orders
            </h2>

            <p>
                View your purchases and check the
                current status of each order.
            </p>

        </section>



        <div id="ordersList">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <div>
                    Loading your orders...
                </div>

            </div>

        </div>


    </main>

 <script type="module" src="orders.js"></script>

</body>

</html>
